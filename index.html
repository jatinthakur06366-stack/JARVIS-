
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020817;color:#00cfff;
 font-family:Arial,sans-serif;text-align:center;
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;flex-direction:column;
}
h1{letter-spacing:8px;text-shadow:0 0 20px #00cfff}
.core{
 width:190px;height:190px;border-radius:50%;
 border:3px solid #00cfff;
 box-shadow:0 0 25px #00cfff,inset 0 0 30px #007bff;
 display:flex;align-items:center;justify-content:center;
 margin:35px auto;animation:pulse 2s infinite;
}
.core span{font-size:45px}
@keyframes pulse{50%{box-shadow:0 0 50px #00cfff,inset 0 0 45px #007bff}}
button{
 background:#003b59;color:#00eaff;border:1px solid #00cfff;
 padding:15px 25px;border-radius:30px;margin:8px;
 font-size:16px;
}
button:active{background:#007ba8}
#status{color:#70eaff;margin:15px}
#reply{padding:15px;max-width:90%;min-height:60px;color:white}
input{
 background:#071a2c;color:white;border:1px solid #00cfff;
 padding:14px;border-radius:20px;width:80%;margin:10px;
}
</style>
</head>
<body>
<h1>J.A.R.V.I.S</h1>
<div>PERSONAL ASSISTANT • DEMO MODE</div>
<div class="core"><span>◉</span></div>
<div id="status">SYSTEM ONLINE</div>
<div id="reply">Hello! I am JARVIS. How can I help you?</div>
<input id="command" placeholder="Type your command...">
<div>
<button onclick="listen()">🎙 SPEAK</button>
<button onclick="send()">SEND</button>
<button onclick="speak('System is online.')">🔊 TEST VOICE</button>
</div>
<script>
const statusText=document.getElementById("status");
const reply=document.getElementById("reply");
const input=document.getElementById("command");

function speak(text){
 const speech=new SpeechSynthesisUtterance(text);
 speech.lang="en-IN";
 speech.rate=1;
 speechSynthesis.cancel();
 speechSynthesis.speak(speech);
}

function answer(text){
 reply.textContent=text;
 speak(text);
}

function send(){
 const q=input.value.trim().toLowerCase();
 if(!q)return;
 input.value="";

 if(q.includes("hello")||q.includes("hi")){
 answer("Hello! I am JARVIS. All systems are running.");
 }
 else if(q.includes("your name")||q.includes("who are you")){
 answer("I am JARVIS, your personal demo assistant.");
 }
 else if(q.includes("time")){
 answer("The time is "+new Date().toLocaleTimeString());
 }
 else if(q.includes("date")){
 answer("Today's date is "+new Date().toLocaleDateString());
 }
 else if(q.includes("how are you")){
 answer("I am functioning perfectly. Thank you.");
 }
 else if(q.includes("open google")){
 answer("Opening Google.");
 window.open("https://www.google.com","_blank");
 }
 else if(q.includes("open youtube")){
 answer("Opening YouTube.");
 window.open("https://www.youtube.com","_blank");
 }
 else if(q.includes("help")){
 answer("You can ask me the time, date, my name, or say open Google or open YouTube.");
 }
 else{
 answer("I am currently in Demo Mode. AI connection is not enabled yet.");
 }
}

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
 answer("Speech recognition is not supported in this browser. Please try Chrome.");
 return;
 }
 const recognition=new SR();
 recognition.lang="en-IN";
 recognition.interimResults=false;
 statusText.textContent="LISTENING...";
 recognition.onresult=e=>{
 input.value=e.results[0][0].transcript;
 statusText.textContent="COMMAND RECEIVED";
 send();
 };
 recognition.onerror=()=>{
 statusText.textContent="VOICE ERROR - TRY AGAIN";
 };
 recognition.onend=()=>{
 if(statusText.textContent==="LISTENING...")
 statusText.textContent="SYSTEM ONLINE";
 };
 recognition.start();
}
</script>
</body>
</html>
