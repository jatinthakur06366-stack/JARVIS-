
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. | AI System</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020812;color:#bceeff;
 font-family:Arial,sans-serif;min-height:100vh;
 overflow-x:hidden;
 background-image:radial-gradient(ellipse at center,#09233a 0%,#020812 65%);
}
header{
 display:flex;justify-content:space-between;align-items:center;
 padding:18px 20px;border-bottom:1px solid #12466b;
 letter-spacing:3px;font-size:13px;
}
.logo{color:#55dfff;font-weight:bold;font-size:19px}
.status{font-size:10px;color:#ffbf58;letter-spacing:1px}
main{max-width:850px;margin:auto;padding:20px}
h1{text-align:center;font-size:25px;letter-spacing:6px;margin:24px 0 5px}
.sub{text-align:center;color:#4689ad;font-size:10px;letter-spacing:4px}
.reactor-area{
 height:340px;display:flex;align-items:center;justify-content:center;
 position:relative;
}
.ring{
 position:absolute;width:270px;height:270px;border-radius:50%;
 border:1px solid #1678a8;
 box-shadow:0 0 22px #0077aa55,inset 0 0 20px #0077aa22;
 animation:spin 18s linear infinite;
}
.ring:before,.ring:after{
 content:"";position:absolute;border:1px dashed #20b9ee88;
 border-radius:50%;inset:13px;
}
.ring:after{inset:28px;border-style:solid;border-color:#1c719b}
.ring.two{width:310px;height:310px;border-style:dashed;animation:spin 28s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core{
 width:155px;height:155px;position:relative;
 display:flex;align-items:center;justify-content:center;
 filter:drop-shadow(0 0 13px #00cfff);
}
.core svg{width:100%;height:100%;overflow:visible}
.core polygon{
 fill:#07334d;stroke:#54eaff;stroke-width:4;
 stroke-linejoin:round;
}
.core .inner{fill:#0b8cbd;stroke:#a9f7ff;stroke-width:2}
.core .center{fill:#c4faff;filter:drop-shadow(0 0 12px #4deaff)}
.core.listening{filter:drop-shadow(0 0 25px #00eaff)}
.core.listening polygon{fill:#075477}
.info{text-align:center;font-size:11px;letter-spacing:3px;color:#58b8db}
.panel{
 border:1px solid #155477;background:#041522cc;
 border-radius:12px;padding:15px;margin-top:18px;
 box-shadow:0 0 20px #0077aa18;
}
.panel-title{font-size:11px;letter-spacing:3px;color:#48cfff;margin-bottom:12px}
#chat{
 height:155px;overflow-y:auto;font-size:14px;line-height:1.6;
}
.msg{margin:9px 0;overflow-wrap:anywhere}
.user{color:#fff}
.jarvis{color:#66dfff}
.controls{display:flex;gap:9px;margin-top:12px}
input{
 flex:1;min-width:0;background:#020b14;color:white;
 border:1px solid #17628a;border-radius:8px;padding:13px;
 outline:none;
}
button{
 background:#07334c;border:1px solid #1688b7;
 color:#9deaff;padding:12px 15px;border-radius:8px;
 cursor:pointer;font-weight:bold;letter-spacing:1px;
}
button:active{background:#0d5878}
.mic{width:100%;margin-top:12px;padding:15px}
.footer{text-align:center;color:#285878;font-size:10px;letter-spacing:2px;padding:25px}
@media(max-width:450px){
 .ring{width:235px;height:235px}
 .ring.two{width:270px;height:270px}
 .reactor-area{height:300px}
 .controls{flex-wrap:wrap}
 .controls input{flex-basis:100%}
 .controls button{flex:1}
}
</style>
</head>
<body>
<header>
 <div class="logo">J.A.R.V.I.S.</div>
 <div class="status" id="status">● CORE STANDBY</div>
</header>

<main>
 <h1>JARVIS SYSTEM</h1>
 <div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

 <div class="reactor-area">
  <div class="ring"></div>
  <div class="ring two"></div>
  <div class="core" id="core">
   <svg viewBox="0 0 200 200">
    <polygon points="100,12 187,165 13,165"/>
    <polygon class="inner" points="100,43 158,145 42,145"/>
    <polygon class="center" points="100,76 121,113 79,113"/>
   </svg>
  </div>
 </div>
 <div class="info" id="info">SYSTEM READY · AWAITING COMMAND</div>

 <section class="panel">
  <div class="panel-title">◈ COMMUNICATION TERMINAL</div>
  <div id="chat">
   <div class="msg jarvis">JARVIS: Good evening. Systems initialized.</div>
   <div class="msg jarvis">JARVIS: AI connection is not configured yet.</div>
  </div>
  <div class="controls">
   <input id="input" placeholder="Enter your command..." />
   <button onclick="send()">SEND</button>
  </div>
  <button class="mic" onclick="listen()">🎙 ACTIVATE VOICE</button>
 </section>

 <div class="footer">STARK-STYLE INTERFACE · LOCAL SYSTEM</div>
</main>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const core=document.getElementById("core");
const statusText=document.getElementById("status");
const info=document.getElementById("info");

function addMessage(who,text){
 const div=document.createElement("div");
 div.className="msg "+(who==="YOU"?"user":"jarvis");
 div.textContent=who+": "+text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}
function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const utter=new SpeechSynthesisUtterance(text);
 utter.lang="en-IN";
 utter.rate=1;
 speechSynthesis.speak(utter);
}
function reply(text){
 addMessage("JARVIS",text);
 speak(text);
}
function send(){
 const text=input.value.trim();
 if(!text)return;
 input.value="";
 addMessage("YOU",text);
 const q=text.toLowerCase();

 if(q.includes("hello")||q.includes("hi jarvis")){
  reply("Hello. I am online and ready for your commands.");
 }else if(q.includes("your name")||q.includes("who are you")){
  reply("I am JARVIS, your personal assistant interface.");
 }else if(q.includes("time")){
  reply("The current time is "+new Date().toLocaleTimeString());
 }else if(q.includes("date")){
  reply("Today is "+new Date().toLocaleDateString());
 }else if(q.includes("youtube")){
  reply("Opening YouTube.");
  window.open("https://youtube.com","_blank");
 }else if(q.includes("google")){
  reply("Opening Google.");
  window.open("https://google.com","_blank");
 }else if(q.includes("how are you")){
  reply("All systems are functioning normally.");
 }else{
  reply("My AI brain is not connected yet. The interface and voice systems are ready, but an AI backend is still required to answer general questions.");
 }
}
input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});

function listen(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  reply("Voice recognition is not supported in this browser.");
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang="en-IN";
 recognition.interimResults=false;
 core.classList.add("listening");
 statusText.textContent="● LISTENING";
 info.textContent="VOICE INPUT ACTIVE";
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  send();
 };
 recognition.onerror=()=>{
  info.textContent="VOICE INPUT UNAVAILABLE";
 };
 recognition.onend=()=>{
  core.classList.remove("listening");
  statusText.textContent="● CORE STANDBY";
  info.textContent="SYSTEM READY · AWAITING COMMAND";
 };
 recognition.start();
}
</script>
</body>
</html>
